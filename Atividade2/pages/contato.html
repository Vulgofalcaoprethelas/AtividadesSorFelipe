<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aifudy Delivery - Contato</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="../index.html">
          <img src="../assets/Logo.jpg" alt="Logo Aifudy Delivery" class="logo-nav" />
          <span>Aifudy Delivery</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navConteudo" aria-controls="navConteudo" aria-expanded="false" aria-label="Alternar navegação">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navConteudo">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./contato.html" aria-current="page">Contato</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./sobre.html">Sobre</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <h1 class="mb-4">Contato</h1>

    <div id="msgContato" class="mb-3" role="alert" style="display:none;"></div>

    <form id="formContato" class="card p-4 shadow-sm" action="#" method="post" novalidate>
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required minlength="2" />
        <div class="invalid-feedback">Informe seu nome.</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required />
        <div class="invalid-feedback">Informe um email válido.</div>
      </div>

      <div class="mb-3">
        <label for="mensagem" class="form-label">Mensagem</label>
        <textarea class="form-control" id="mensagem" name="mensagem" rows="5" required minlength="5"></textarea>
        <div class="invalid-feedback">Escreva sua mensagem (mínimo 5 caracteres).</div>
      </div>

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </main>

  <footer class="text-center py-4 text-muted">
    &copy; 2026 - Aifudy Delivery
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      const form = document.getElementById('formContato');
      const msg = document.getElementById('msgContato');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        // Bootstrap validation styles
        form.classList.add('was-validated');

        if (!form.checkValidity()) return;

        // Simula envio (sem backend)
        const nome = document.getElementById('nome').value.trim();

        msg.style.display = 'block';
        msg.className = 'alert alert-success mb-3';
        msg.textContent = `Mensagem enviada com sucesso, ${nome}! Em breve entraremos em contato.`;

        form.reset();
        form.classList.remove('was-validated');
      });
    })();
  </script>
</body>
</html>
